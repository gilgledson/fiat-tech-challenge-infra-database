name: CI - Validação Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. terraform fmt -check
        run: terraform fmt -check -recursive

      - name: 4. Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 5. terraform init
        run: terraform init

      - name: 6. terraform validate
        run: terraform validate

      - name: 7. terraform plan (só leitura, não aplica)
        if: github.event_name == 'pull_request'
        run: terraform plan
        env:
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}

  # terraform apply continua manual nesta fase — ver seção "Por que o
  # terraform apply é manual" no README.md.
